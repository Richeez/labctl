#!/usr/bin/env bash


###############################################################################
# LABCTL Configuration
###############################################################################

#
# Default Network Profile
#
DEFAULT_PROFILE=NAT

###############################################################################
# Cache
###############################################################################

CACHE_TTL=30

###############################################################################
# Network
###############################################################################

PING_TIMEOUT=2

DNS_TARGET=1.1.1.1

INTERNET_TARGET=8.8.8.8

###############################################################################
# Logging
###############################################################################

LOG_LEVEL=INFO

###############################################################################
# User Interface
###############################################################################

SHOW_BANNER=true

SHOW_PROGRESS=true

SHOW_COLORS=true

###############################################################################
# Behaviour
###############################################################################

AUTO_REFRESH=true

AUTO_SNAPSHOT=true

AUTO_VERIFY=true
AUTO_CACHE=true
AUTO_REPAIR=false

EDITOR=nano

PROGRESS_BAR=true

SHOW_BANNER=true

SHOW_TIMESTAMPS=true

VERIFY_DNS=true

VERIFY_INTERNET=true

VERIFY_GATEWAY=true

VERIFY_INTERFACE=true


